{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <h2>Add Student</h2>
    <p class="form-subtitle">Enter student details, grades, and student code.</p>

    <form method="POST">
        <label for="student_code">Student Code</label>
        <input type="text" name="student_code" id="student_code" placeholder="Enter unique student code">

        <label for="name">Student Name</label>
        <input type="text" name="name" id="name" placeholder="Enter student name">

        <label for="grades">Grades</label>
        <input type="text" name="grades" id="grades" placeholder="Example: 90,80,75">

        <button type="submit">Add Student</button>
    </form>
</div>
{% endblock %}
